[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milano-mobility-mcp"
version = "0.1.0"
description = "Server MCP prudente per mobilità e restrizioni a Milano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.11,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
milano-mobility-mcp = "milano_mobility_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
